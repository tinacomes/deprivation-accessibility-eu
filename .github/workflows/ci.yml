name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps (stats extra enables the
              regression/clustering tests)
        run: pip install -e ".[dev,stats]"
      - name: Run unit tests
        run: pytest --cov=depacc --cov-report=term-missing
      - name: Validate shipped configs load
        run: depacc validate --city hamburg
      # The pack's prose quotes ~100 numbers copied out of its CSVs. This
      # re-reads each one from its source table, so a refreshed table that
      # nobody re-copied into BRIEF.md fails CI instead of reaching a
      # referee.
      - name: Audit the paper pack's quoted numbers against its tables
        run: python tools/audit_paper_pack.py
