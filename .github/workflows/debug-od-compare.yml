name: debug od compare (temporary)

# Temporary diagnostic for the §5.15 reversed-walk anomaly: the Köln r5
# cross-check (run 30535437441) produced reversed-walk OD matrices whose
# downstream t_eff agrees with the FRICTION baseline at ρ≈0.9997 — too close
# for a 1 km raster vs a street network — while forward-walk (green space) and
# reversed-car matrices disagree the way §5.10 says engines should. This job
# restores the run's derived cache and compares the two engines' OD parquets
# PAIR BY PAIR, printing everything to the log (artifacts are unreachable from
# the diagnosing session's network). Delete this workflow once §5.15 closes.

on:
  workflow_dispatch:
    inputs:
      city:
        description: "city id"
        default: "koeln"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas pyarrow numpy

      - name: Restore per-city derived cache
        uses: actions/cache/restore@v4
        with:
          path: data/derived/${{ inputs.city }}
          key: depacc-derived-${{ inputs.city }}-never-match
          restore-keys: |
            depacc-derived-${{ inputs.city }}-

      - name: Compare base vs shadow OD matrices
        run: |
          python - <<'EOF'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          city = "${{ inputs.city }}"
          base = Path(f"data/derived/{city}")
          alt = base / "engine_r5"
          print(f"base dir: {sorted(p.name for p in base.glob('od_*.parquet'))}")
          print(f"alt dir:  {sorted(p.name for p in alt.glob('od_*.parquet'))}")

          for name in sorted(p.name for p in alt.glob("od_*.parquet")):
              bp, ap = base / name, alt / name
              if not bp.exists():
                  print(f"\n== {name}: NO BASE FILE ==")
                  continue
              b = pd.read_parquet(bp)
              a = pd.read_parquet(ap)
              m = b.merge(a, on=["origin", "dest"], suffixes=("_b", "_a"))
              print(f"\n== {name} ==")
              print(f"  base: {len(b)} pairs, {b.origin.nunique()} origins, "
                    f"time dtype {b.time.dtype}, "
                    f"median {b.time.median():.3f}, frac_integer "
                    f"{(b.time == b.time.round()).mean():.3f}")
              print(f"  alt:  {len(a)} pairs, {a.origin.nunique()} origins, "
                    f"time dtype {a.time.dtype}, "
                    f"median {a.time.median():.3f}, frac_integer "
                    f"{(a.time == a.time.round()).mean():.3f}")
              print(f"  joint pairs: {len(m)} "
                    f"({len(m)/max(len(a),1):.1%} of alt)")
              if len(m):
                  d = (m.time_a - m.time_b)
                  print(f"  time delta on joint pairs: mean {d.mean():.4f}, "
                        f"median {d.median():.4f}, p90 {d.quantile(0.9):.4f}, "
                        f"max|d| {d.abs().max():.4f}, "
                        f"identical {(d == 0).mean():.3%}, "
                        f"corr {np.corrcoef(m.time_a, m.time_b)[0,1]:.5f}")
                  print("  sample joint rows:")
                  print(m.head(5).to_string())
              # nearest-time-per-origin comparison (independent of pair overlap)
              nb = b.groupby("origin").time.min()
              na = a.groupby("origin").time.min()
              j = pd.concat([nb.rename("b"), na.rename("a")], axis=1).dropna()
              if len(j):
                  print(f"  nearest-per-origin on {len(j)} shared origins: "
                        f"median_b {j.b.median():.3f} median_a {j.a.median():.3f} "
                        f"corr {np.corrcoef(j.a, j.b)[0,1]:.5f} "
                        f"identical {(j.a == j.b).mean():.3%}")

          sp = base / "surfaces.parquet"
          spa = alt / "surfaces.parquet"
          if sp.exists() and spa.exists():
              sb = pd.read_parquet(sp)
              sa = pd.read_parquet(spa)
              cols = [c for c in sb.columns if c.startswith("t_regime_")]
              print("\n== surfaces t_regime columns (base vs alt) ==")
              for c in cols:
                  if c in sa.columns:
                      x = sb[c].astype(float)
                      y = sa[c].reindex(sb.index).astype(float)
                      ok = x.notna() & y.notna()
                      ident = (x[ok] == y[ok]).mean() if ok.any() else np.nan
                      print(f"  {c}: identical values {ident:.3%} on {ok.sum()} cells")
          EOF
