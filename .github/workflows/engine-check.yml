name: engine cross-check (E.1)

# Workstream E.1 — routing-engine cross-check for ONE city.
#
# Re-routes a city under an alternative engine (default r5, over the real OSM
# street network) holding cells, FACILITIES and every model parameter fixed, then
# reports how far the travel times, the city-row indicators and the typology
# move. Answers the question the Tier-1 fast path has always begged: how much
# does the 1 km Weiss friction surface cost us?
#
# Trigger: GitHub -> Actions -> "engine cross-check (E.1)" -> Run workflow.
# Results land in data/derived/validation/ and are uploaded as
# depacc-engine-check-<city>. Nothing is pushed to depacc-results: the shadow run
# is a validation artefact, not a city.
#
# Budget: MEASURED on runs 30164334307 and 30251028718 (Hamburg, r5, 176 137
# origins), not guessed.
#
#   network fetch/clip/merge + R5 build   ~15-27 min
#   each walk service (30 min cutoff)     18-27 min; five of them ~1 h 53
#   emergency car (60 min cutoff)         ~39.5 min per 5 000-origin chunk
#                                         = ~24 h PER SERVICE, two services
#
# Forwards, the emergency leg alone is ~47 h — far past the 6 h hard cap on a
# GitHub-hosted job. Two mechanisms make this tractable:
#
# 1. `reverse_modes: car walk` routes the matrices FACILITIES -> CELLS and
#    transposes them back. R5 costs one street search per ORIGIN, so 27
#    emergency departments cost 27 searches rather than 176 137 — minutes, not
#    a day. Exact only for a symmetric network, so the run MEASURES the
#    direction asymmetry against any forward-routed chunks on disk and writes
#    it to validation/<city>_engine_reverse_asymmetry.csv. Hamburg's measured
#    car asymmetry (run 30275890587, 234 788 pairs): median |Δ| 1.0 min on an
#    11-min median, mean signed +0.22 — and R5 reports whole minutes, so part
#    of that is quantisation. WALK is reversed too since walking is not
#    subject to one-way streets or turn restrictions: 600-2 000 facility
#    searches replace 176 137 cell searches per service, which turns the
#    ~2 h walk leg into minutes and makes a SECOND-CITY cross-check (the open
#    question from §5.10: is the -30 % gini_emergency offset stable across
#    cities?) an ~30-min dispatch instead of a day. The per-facility ratio
#    guard in access/matrices.py declines the transpose for any service with
#    too few cells per facility for it to pay.
# 2. `budget_min` stops the access stage cleanly while the job is still alive.
#    A job that hits its own timeout is CANCELLED, and a cancelled job skips
#    actions/cache's save step — that is how run 30164334307 threw away 2 h 20
#    of finished walk matrices and uploaded an empty artefact. Stopping under
#    budget writes the cache, so a re-dispatch picks up at the last finished
#    origin chunk.
#
# Do NOT dispatch with modes=walk expecting a walk-only cross-check: the mode
# override only touches routing.modes, while regimes.emergency.modes stays
# ["car"], so run_deprivation finds no emergency service and raises
# "No services computed for regime 'emergency'".
#
# ALWAYS DISPATCH EVERY RUN FROM THE SAME BRANCH. GitHub scopes a cache to the
# branch that wrote it: a branch can read its own caches and the DEFAULT
# branch's, and nothing else. Dispatch once from a feature branch and once from
# main and the second run restores nothing, re-routing hours of finished work.
# Dispatching from main throughout is the safest, because main's caches are
# also visible to every other branch.
#
# The alternative surfaces are cached under
# data/derived/<city>/engine_<engine>/, so a re-dispatch that only wants the
# comparison re-run is minutes; pass reuse=false to force re-routing.

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City id (config/cities/<id>.yaml)"
        required: true
        default: "hamburg"
      engine:
        description: "Alternative engine to compare the city's configured one against"
        required: false
        default: "r5"
      modes:
        description: "Space-separated mode override for the alternative run (blank = the city's own, e.g. 'walk car transit')"
        required: false
        default: ""
      reuse:
        description: "Reuse cached alternative surfaces if present (false re-routes from scratch)"
        required: false
        default: "true"
      budget_min:
        description: "Wall-clock minutes routing may use PER STEP before stopping cleanly and caching its progress. Applies to the baseline rebuild and the cross-check separately, so keep it under each step's 165-min timeout."
        required: false
        default: "150"
      reverse_modes:
        description: "Modes routed facilities->cells and transposed back (blank = none). 'car walk' turns the ~24 h/service emergency leg AND the ~2 h walk leg into minutes; the run reports the measured direction asymmetry."
        required: false
        default: "car walk"

# Two dispatches for the same city must never run at once: they would restore
# the same derived cache, route overlapping work, and the later save would
# silently discard the other's progress. Queue them instead — and do NOT cancel
# the one in flight, which would lose everything it has routed so far.
concurrency:
  group: engine-check-${{ inputs.city }}-${{ inputs.engine }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  # Raw-data cache split; must match .github/workflows/run-city.yml,
  # tier1-batch.yml and depacc.ingest.prefetch.
  SHARED_RAW_PATHS: |
    data/raw/boundaries
    data/raw/census
    data/raw/ghs
    data/raw/ses
  CITY_RAW_PATHS: |
    data/raw/friction
    data/raw/gtfs
    data/raw/osm
    data/raw/overpass

jobs:
  engine-check:
    runs-on: ubuntu-latest
    # Just under the 6 h hard cap for GitHub-hosted runners. This is the
    # BACKSTOP, not the plan: hitting it cancels the job, and a cancelled job
    # skips actions/cache's save step, losing every matrix built. `budget_min`
    # (default 240) and the routing step's own timeout below are what keep the
    # run inside it.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # R5 needs a JDK; the friction baseline does not, but this job runs both.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install osmium-tool (clips the state-level OSM extract down to the
              FUA window so parsing stays within runner memory)
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Install depacc (full stack)
        run: pip install -e ".[full,dev]"

      # r5py's default JVM heap is 80 % of physical RAM — ~12.8 GB of the
      # standard runner's 16. That leaves too little for Python holding the
      # dense reverse-mode result frames: run 30526795903 (Köln) starved the
      # runner agent and died at 80 min with NO step conclusion, NO cache
      # saves and NO logs ("the hosted runner lost communication"). Capped,
      # memory pressure surfaces as a Java OutOfMemoryError inside the step —
      # a real log line, a failed step, and the always() cache saves still run.
      - name: Cap the R5 JVM heap so OOM fails the step, not the runner
        run: |
          mkdir -p ~/.config
          echo "max-memory: 8G" > ~/.config/r5py.yml
          cat ~/.config/r5py.yml

      # ------------------------------------------------------------------
      # Caches are RESTORE-only here, with explicit `if: always()` saves after
      # the routing step. This is not a style choice — actions/cache@v4
      # declares `post-if: success()`, so its automatic save is skipped the
      # moment anything in the job fails, and skipped entirely when the job is
      # cancelled. That is precisely how run 30164334307 lost 2 h 22 of
      # finished walk matrices. Its `save-always` input carries an upstream
      # deprecation notice ("does not work as intended"); the documented
      # replacement is this restore/save split.
      # ------------------------------------------------------------------
      - name: Restore/seed the SHARED raw-data cache
        id: cache_raw_shared
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SHARED_RAW_PATHS }}
          key: depacc-raw-shared-v1-${{ hashFiles('config/defaults.yaml', 'config/cities/*.yaml') }}
          restore-keys: depacc-raw-shared-v1-

      - name: Restore this city's raw-data cache
        id: cache_raw_city
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CITY_RAW_PATHS }}
          key: depacc-raw-city-${{ inputs.city }}-${{ hashFiles('config/cities/*.yaml') }}
          restore-keys: |
            depacc-raw-city-${{ inputs.city }}-
            depacc-raw-${{ inputs.city }}-

      # The same per-city derived cache the pipeline uses. It carries the
      # BASELINE surfaces this check compares against, and the shadow run's own
      # outputs live inside it (data/derived/<city>/engine_<engine>/) so a
      # re-dispatch resumes instead of re-routing.
      - name: Restore per-city derived cache
        id: cache_derived
        uses: actions/cache/restore@v4
        with:
          path: data/derived/${{ inputs.city }}
          key: depacc-derived-${{ inputs.city }}-${{ github.run_id }}
          restore-keys: |
            depacc-derived-${{ inputs.city }}-

      - name: Report what was restored
        run: |
          echo "shared raw : ${{ steps.cache_raw_shared.outputs.cache-matched-key || 'MISS' }}"
          echo "city raw   : ${{ steps.cache_raw_city.outputs.cache-matched-key || 'MISS' }}"
          echo "derived    : ${{ steps.cache_derived.outputs.cache-matched-key || 'MISS' }}"
          echo
          echo "Restored OD matrices for the shadow run:"
          ls -1 "data/derived/${{ inputs.city }}/engine_${{ inputs.engine }}"/od_*.parquet 2>/dev/null | sed 's/^/  /' || echo "  (none — this is the first routing dispatch)"

      # The check compares against the city's existing baseline surfaces. If the
      # derived cache was evicted — or the city has never been run — rebuild
      # them first; the comparison is meaningless without a baseline.
      #
      # This step needs the SAME two guards as the cross-check below, and for
      # the same reason. It had neither, and run 30476375657 spent over an hour
      # here: a cache miss sent it into a full rebuild whose routing had no
      # budget (`DEPACC_ROUTING_BUDGET_MIN` was set only on the cross-check
      # step) and no step timeout, so nothing could stop it before the JOB
      # timeout — which cancels, and a cancelled job skips the `if: always()`
      # cache saves below, discarding every matrix it had built. That is the
      # exact failure §5.9 diagnosed and fixed for the other step only.
      #
      # A budget stop here exits 2. That is forward progress, not a failure:
      # the partial routing is cached by the save steps below and a re-dispatch
      # resumes. The cross-check is skipped in that case, because surfaces
      # built on a half-routed city would mark every unrouted cell deprived.
      - name: Ensure the baseline surfaces exist
        id: baseline
        timeout-minutes: 165
        env:
          DEPACC_ROUTING_BUDGET_MIN: ${{ inputs.budget_min }}
          DEPACC_REVERSE_MODES: ${{ inputs.reverse_modes }}
        run: |
          if [ -f "data/derived/${{ inputs.city }}/surfaces.parquet" ]; then
            echo "baseline surfaces present; reusing them"
            echo "rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::No cached baseline for '${{ inputs.city }}': the derived cache missed, so ingest+access+deprivation must run first. This is the slow path and the cross-check has not started yet."
          set +e
          depacc run --city "${{ inputs.city }}" --stage deprivation
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "2" ]; then
            echo "::notice::Baseline routing stopped on its budget with progress cached. Re-dispatch to resume; the cross-check is skipped until the baseline is complete."
            exit 0
          fi
          exit $rc

      # Step-level timeout, deliberately BELOW the job timeout. A step that
      # times out FAILS, and later `if: always()` steps — including the cache
      # saves — still run; a job that times out is CANCELLED, and nothing after
      # it runs at all. The budget inside depacc should stop first and more
      # gracefully; this is the guard for the case where one origin chunk
      # itself overruns.
      #
      # 165 + 165 for the two routing steps + ~15 min of setup, caching and
      # upload sits under the job's 355. It used to be 320 here with NO timeout
      # on the baseline step, so a job that had to rebuild a baseline could not
      # fit its own steps inside its own timeout — the arithmetic never worked,
      # it was simply never exercised until a cache missed.
      #
      # Skipped when the baseline stopped on its budget: surfaces built on a
      # half-routed city would mark every unrouted cell service-deprived, so
      # there is nothing meaningful to compare against yet.
      - name: Cross-check against ${{ inputs.engine }}
        id: check
        if: steps.baseline.outputs.rc == '0'
        timeout-minutes: 165
        continue-on-error: true
        env:
          DEPACC_ROUTING_BUDGET_MIN: ${{ inputs.budget_min }}
        run: |
          ARGS=(--city "${{ inputs.city }}" --engine "${{ inputs.engine }}")
          if [ -n "${{ inputs.modes }}" ]; then
            ARGS+=(--modes ${{ inputs.modes }})
          fi
          if [ "${{ inputs.reuse }}" != "true" ]; then
            ARGS+=(--no-reuse)
          fi
          # Always pass the flag: with no values it explicitly DISABLES reverse
          # routing, which is how a run asks for the slow exact direction.
          ARGS+=(--reverse-modes ${{ inputs.reverse_modes }})
          set +e
          depacc engine-check "${ARGS[@]}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Show the comparison
        if: always()
        run: |
          f="data/derived/validation/${{ inputs.city }}_engine_check.csv"
          [ -f "$f" ] && cat "$f" || echo "no comparison written"

      # Always leave something in the upload path, so a run that stopped on
      # budget reports its state as an artefact rather than as an empty upload
      # with a "No files were found" warning.
      - name: Record the routing progress
        if: always()
        run: |
          mkdir -p data/derived/validation
          m="data/derived/validation/${{ inputs.city }}_engine_check_status.txt"
          {
            echo "run:        ${{ github.run_id }}"
            echo "city:       ${{ inputs.city }}"
            echo "engine:     ${{ inputs.engine }}"
            echo "modes:      ${{ inputs.modes }}"
            echo "budget_min: ${{ inputs.budget_min }}"
            echo "reverse:    ${{ inputs.reverse_modes }}"
            echo "baseline:   rc=${{ steps.baseline.outputs.rc }} (2 = stopped on budget, cross-check skipped)"
            echo "exit_code:  ${{ steps.check.outputs.rc }}"
            echo
            echo "OD matrices in the shadow derived dir:"
            ls -la "data/derived/${{ inputs.city }}/engine_${{ inputs.engine }}"/od_*.parquet 2>/dev/null || echo "  (none)"
            echo
            echo "Checkpointed (incomplete) matrices:"
            for d in "data/derived/${{ inputs.city }}/engine_${{ inputs.engine }}"/od_*.partial; do
              [ -d "$d" ] && echo "  $(basename "$d"): $(ls "$d" | wc -l) origin chunk(s)"
            done
          } | tee "$m"

      # ------------------------------------------------------------------
      # SAVE, unconditionally and BEFORE the gate step below can fail the job.
      # This is the step that makes "dispatch until it finishes" work at all.
      # continue-on-error so that a duplicate-key collision (another dispatch
      # racing this one) can never fail an otherwise good run.
      # ------------------------------------------------------------------
      - name: Save the per-city derived cache (routing progress)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/derived/${{ inputs.city }}
          # Keyed on run_id, so it is never an exact hit and this always
          # writes a new entry carrying whatever this run managed to route.
          key: depacc-derived-${{ inputs.city }}-${{ github.run_id }}

      # The raw caches are content-keyed and therefore only worth writing when
      # this run actually fetched something new. The city one has never been
      # saved successfully (run 30164334307 logged "Cache not found for input
      # keys: depacc-raw-city-hamburg-..."), which is why that run re-downloaded
      # and re-clipped 676 MB of Geofabrik extracts.
      - name: Save this city's raw-data cache
        if: always() && steps.cache_raw_city.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CITY_RAW_PATHS }}
          key: depacc-raw-city-${{ inputs.city }}-${{ hashFiles('config/cities/*.yaml') }}

      - name: Save the SHARED raw-data cache
        if: always() && steps.cache_raw_shared.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SHARED_RAW_PATHS }}
          key: depacc-raw-shared-v1-${{ hashFiles('config/defaults.yaml', 'config/cities/*.yaml') }}

      # Exit code 2 is depacc's "stopped on budget, progress is cached,
      # re-dispatch to resume" — a resumable stop, not a failure. Anything else
      # non-zero is a real failure and must fail the run. This runs LAST so
      # that failing it cannot cost the saves above.
      - name: Fail on a real error (not a budget stop)
        if: always()
        run: |
          base_rc="${{ steps.baseline.outputs.rc }}"
          rc="${{ steps.check.outputs.rc }}"
          # A baseline that stopped on budget skips the cross-check, so `rc` is
          # empty. That is forward progress with the routing cached, NOT the
          # "step killed" case, and must not fail the run.
          if [ "$base_rc" = "2" ]; then
            echo "::notice::The BASELINE for '${{ inputs.city }}' is still being routed; it stopped on its ${{ inputs.budget_min }} min budget with progress cached. Re-dispatch to continue — the cross-check starts once the baseline is complete."
            exit 0
          fi
          if [ "$rc" = "0" ]; then
            echo "cross-check complete"
          elif [ "$rc" = "2" ]; then
            echo "::notice::Routing stopped on its ${{ inputs.budget_min }} min budget with progress cached. Re-dispatch this workflow for '${{ inputs.city }}' to resume from the last finished origin chunk."
          else
            echo "::error::engine-check failed with exit code ${rc:-<step killed>}"
            exit 1
          fi

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depacc-engine-check-${{ inputs.city }}
          path: |
            data/derived/validation
          if-no-files-found: warn
          retention-days: 90
