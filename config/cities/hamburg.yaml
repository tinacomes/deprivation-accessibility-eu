# ============================================================================
# Hamburg — first Tier-2 deep-dive city.
# ============================================================================

city:
  id: "hamburg"
  name: "Hamburg"
  country: "DE"
  tier: 2
  # Eurostat Urban Audit code of the Hamburg Functional Urban Area (URAU
  # 2021 FUA codes end in "F"). Boundary fetched from GISCO URAU 2021;
  # ingest cross-checks the FUA name against city.name and warns on mismatch.
  fua_code: "DE002F"
  # Local projected CRS for routing accuracy (UTM 32N); analysis outputs are
  # reprojected to the global analysis CRS (EPSG:3035).
crs:
  local: "EPSG:32632"

sources:
  osm_pbf:
    # Geofabrik extract covering the Hamburg FUA (the FUA spills into
    # Schleswig-Holstein and Lower Saxony, so use the north-Germany-covering
    # extracts and clip to the FUA boundary).
    url: "https://download.geofabrik.de/europe/germany/hamburg-latest.osm.pbf"
    # Additional extracts merged before clipping (FUA commuting zone):
    extra_urls:
      - "https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf"
      - "https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf"
    licence: "ODbL 1.0"
  gtfs:
    # Aggregated Germany-wide GTFS (DELFI via gtfs.de); clipped to the FUA
    # bounding box during ingest. Free tier, attribution required.
    feeds:
      - id: "gtfs_de_germany"
        url: "https://download.gtfs.de/germany/free/latest.zip"
        licence: "CC-BY 4.0 (gtfs.de aggregation of DELFI open data)"
  ses:
    # Germany Zensus 2022 100 m INSPIRE grid CSVs (open data). Each zip bundles
    # the 10 km / 1 km / 100 m grid CSVs for one theme (destatis "Gitterdaten"
    # release). The ingest loader reads the 100 m CSV (semicolon-separated,
    # German decimal commas) and snaps it to the GHS grid; the provenance
    # sidecar records the URL + SHA-256 actually fetched.
    provider: "zensus2022_de_100m"
    base_url: "https://www.zensus2022.de/DE/Ergebnisse-des-Zensus/gitterzellen.html"
    layers:
      - "population"        # Einwohnerzahl
      - "age_structure"     # Alter in 5 Altersklassen (-> under-15 / 65+ shares)
      - "household_size"    # Durchschnittliche Haushaltsgroesse
      - "net_rent"          # Durchschnittliche Nettokaltmiete
      - "ownership_rate"    # Eigentuemerquote
      - "vacancy_rate"      # Leerstandsquote
    urls:
      population: "https://www.destatis.de/static/DE/zensus/gitterdaten/Zensus2022_Bevoelkerungszahl.zip"
      age_structure: "https://www.destatis.de/static/DE/zensus/gitterdaten/Alter_in_5_Altersklassen.zip"
      household_size: "https://www.destatis.de/static/DE/zensus/gitterdaten/Durchschnittliche_Haushaltsgroesse_in_Gitterzellen.zip"
      net_rent: "https://www.destatis.de/static/DE/zensus/gitterdaten/Zensus2022_Durchschn_Nettokaltmiete.zip"
      ownership_rate: "https://www.destatis.de/static/DE/zensus/gitterdaten/Eigentuemerquote_in_Gitterzellen.zip"
      vacancy_rate: "https://www.destatis.de/static/DE/zensus/gitterdaten/Leerstandsquote_in_Gitterzellen.zip"
    licence: "dl-de/by-2-0"
    # Post-join derivations. The age-structure zip is "Alter in 5 Altersklassen"
    # (Unter18 / 18-29 / 30-49 / 50-64 / 65+), so the youngest available cut is
    # under-18, not under-15. Column names are the joined ses_age_structure_*
    # from the run at run 30094277689.
    derived:
      age_shares:
        population_col: "ses_age_structure_Insgesamt_Bevoelkerung"
        bands:
          ses_age_share_u18: ["ses_age_structure_Unter18"]
          ses_age_share_ge65: ["ses_age_structure_a65undaelter"]

# Equity stage: which SES column ranks the concentration index and which
# columns enter the gradient regressions (each regressed univariately, so the
# heterogeneously-suppressed rent/vacancy layers keep their own support).
equity:
  ses_rank_column: "ses_net_rent_durchschnMieteQM"
  ses_covariates:
    - "ses_age_share_u18"
    - "ses_age_share_ge65"
    - "ses_net_rent_durchschnMieteQM"
    - "ses_ownership_rate_Eigentuemerquote"
    - "ses_vacancy_rate_Leerstandsquote"
  # Vulnerability-stratified deprivation: each stratum is the population-weighted
  # tail of a vulnerability variable. `level: age` strata are census-harmonised
  # and cross-city comparable; `level: income_tier2` exists only where a fine
  # SES grid does — never pool the two across cities. HH share uses the p50
  # typology by default (vulnerability_hh_threshold).
  vulnerability_strata:
    - name: "elderly"
      column: "ses_age_share_ge65"
      direction: "high"
      quantile: 0.75
      level: "age"
    - name: "children"
      column: "ses_age_share_u18"
      direction: "high"
      quantile: 0.75
      level: "age"
    - name: "low_rent"
      column: "ses_net_rent_durchschnMieteQM"
      direction: "low"
      quantile: 0.25
      level: "income_tier2"
    # Tenure insecurity: the quartile of population in the lowest-ownership
    # (highest-renter) cells. Tier-2 only; not comparable across cities.
    - name: "low_ownership"
      column: "ses_ownership_rate_Eigentuemerquote"
      direction: "low"
      quantile: 0.25
      level: "income_tier2"

routing:
  # Fast path: least-cost paths over the Weiss et al. friction surfaces
  # (walk + car), reusing the OSM facilities already ingested — no R5, no
  # Java, minutes not hours. Tractable for this 176k-cell / 6135 km2 FUA.
  #
  # For the full Tier-2 transit deep-dive, switch back to:
  #   engine: "r5"
  #   modes: ["walk", "car", "transit"]
  # (heavy at 176k cells — scope to the urban core or expect a long run).
  engine: "friction"
  modes: ["walk", "car"]
