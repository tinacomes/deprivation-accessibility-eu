# ============================================================================
# Köln — second Tier-2 deep-dive city (generalisation check for the
# Hamburg-first pipeline; same national data sources, different FUA).
# ============================================================================

city:
  id: "koeln"
  name: "Köln"
  country: "DE"
  tier: 2
  fua_code: "DE004F"   # URAU 2021 FUA code (ingest warns if the FUA name
                       # does not match city.name — re-check with list-fuas)

crs:
  local: "EPSG:32632"   # UTM 32N

sources:
  # Facilities always come from Overpass, whatever the routing engine:
  # the engine choice must never change the facility set (methods.md
  # §5, §7.1). The .pbf below is the r5 STREET NETWORK only.
  facilities: "overpass"
  osm_pbf:
    url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen-latest.osm.pbf"
    licence: "ODbL 1.0"
  gtfs:
    feeds:
      - id: "gtfs_de_germany"
        url: "https://download.gtfs.de/germany/free/latest.zip"
        licence: "CC-BY 4.0 (gtfs.de aggregation of DELFI open data)"
  ses:
    provider: "zensus2022_de_100m"
    layers: ["population", "age_structure", "household_size", "net_rent",
             "ownership_rate", "vacancy_rate"]
    licence: "dl-de/by-2-0"

routing:
  # MUST be stated explicitly (test_every_city_declares_its_routing_engine).
  # r5 over the real street network is the PRIMARY engine (methods.md §5): the
  # E.1 cross-check on Hamburg and Köln showed the friction fast path's error
  # is city-specific (gini_emergency −18.5 % here vs −30 % in Hamburg), so it
  # cannot be corrected away, while reverse routing below makes a full r5 city
  # ~30 min instead of ~8–12 h. WITHOUT `transit` in the mode set — transit is
  # the Tier-2 deep-dive, dispatched deliberately, never inherited (run
  # 30476375657 spent an hour in a forward-R5 transit baseline by accident).
  # Friction remains available as the SENSITIVITY variant:
  #   depacc engine-check --city koeln --engine friction
  engine: "r5"
  modes: ["walk", "car"]
  reverse_direction: ["car", "walk"]
