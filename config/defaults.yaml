# ============================================================================
# Global defaults for the potential-deprivation accessibility study.
# Per-city files in config/cities/*.yaml override any key here (deep merge).
# ============================================================================

crs:
  # Continental analysis CRS: ETRS89 / LAEA Europe.
  analysis: "EPSG:3035"
  # Optional per-city projected CRS for local routing accuracy; a city config
  # may set e.g. "EPSG:32632" (UTM 32N). null = use analysis CRS throughout.
  local: null

city_definition:
  # One harmonised definition for every city in the sample:
  # Eurostat-OECD Functional Urban Areas (GISCO URAU), cross-checked against
  # JRC GHS Urban Centre Database / Degree of Urbanisation.
  source: "eurostat_oecd_fua"
  # F.1: FUA populations (fua_code, population) compiled from Eurostat
  # urb_lpop1 by `depacc build-fua-population` (workflow "build FUA population
  # table (F.1)"), cross-checked against the URAU FUA layer. list-fuas joins
  # it when present and degrades with a NOTE when not.
  fua_population_csv: "config/fua_population.csv"
  # Tier-1 inclusion threshold on FUA population.
  fua_size_threshold: 100000
  # "stratified": size-stratified sample within a few countries (fast first
  # cross-city figure). "all_eu_fua": full continental run.
  city_sample_mode: "stratified"
  stratified_countries: ["DE", "NL", "FR"]
  # Size strata bounds (FUA population) used by the stratified sampler.
  strata_bounds: [100000, 250000, 500000, 1000000, 5000000]

tiers:
  tier1:
    # Harmonised continental layer: OSM-based walk + car ONLY. No transit.
    modes: ["walk", "car"]
    population: "ghs_pop_100m"
    demographics: "eurostat_census_2021_1km"
    # Optional coarse cross-check with the Weiss et al. motorised friction
    # surface (1 km).
    friction_surface_check: false
  tier2:
    # Deep-dive subset: adds multimodal public transit (r5py + R5 + GTFS) and
    # fine national SES grids (DE Zensus 2022 100m, NL CBS 100m, FR INSEE
    # Filosofi 200m, UK LSOA + IMD).
    modes: ["walk", "car", "transit"]
    countries: ["DE", "NL", "FR", "UK", "SE", "NO", "DK", "FI"]

sources:
  census:
    # ------------------------------------------------------------------------
    # EU-HARMONISED DEMOGRAPHICS FOR EVERY CITY (tiers.tier1.demographics):
    # Eurostat Census 2021 1 km grid, published by GISCO in EPSG:3035 with an
    # INSPIRE GRD_ID per cell. Carries the 13 variables of EU Regulation
    # 2018/1799: total population, sex, broad age (< 15 / 15-64 / >= 65),
    # current activity status (employed persons — VOLUNTARY, so absent for some
    # countries), country of birth, and place of usual residence one year
    # before the census.
    #
    # Joined onto the 100 m analysis grid by 1 km cell id, i.e. BROADCAST: each
    # 100 m cell inherits its kilometre's value, so these are neighbourhood
    # attributes with no within-kilometre variation (see methods.md §6 and
    # data/derived/<city>/ses_resolutions.json). Prefixed ses_census_*, which
    # is what carries them into the equity stage.
    # ------------------------------------------------------------------------
    provider: "eurostat_census_2021_1km"
    landing_page: "https://ec.europa.eu/eurostat/web/gisco/geodata/population-distribution/population-grids"
    # V3 — the current release. V1-0 (which we tried first) has no CSV at all
    # and its GeoPackage's default layer carries only ['GRD_ID','OBS_VALUE_T'],
    # i.e. total population and nothing else; V2-0 (16-06-2024) is what the JRC
    # 100 m disaggregation was built from. V3 ships ONE WIDE TABLE with every
    # variable, in GeoPackage, CSV, Parquet and GeoTIFF.
    url: "https://gisco-services.ec.europa.eu/census/2021/Eurostat_Census-GRID_2021_V3.zip"
    note: >-
      URL, member and variable codes all CONFIRMED against the release read.me.
      Variables per cell: GRD_ID, CNTR_ID (reporting countries), T/M/F,
      Y_LT15 / Y_1564 / Y_GE65 (note: Y_1564, NOT Y_15-64), EMP, NAT / EU_OTH /
      OTH (place of birth), SAME / CHG_IN / CHG_OUT (residence one year prior),
      LAND_SURFACE (km2 in [0,1], float) and POPULATED (1/0). All integers
      except GRD_ID, CNTR_ID (text) and LAND_SURFACE.
      We read the CSV member rather than the GeoPackage: same wide table,
      streams out of the zip in chunks with no 1.3 GB extraction, and needs no
      geometry stack. The GeoTIFF is int64 and therefore cannot carry GRD_ID,
      CNTR_ID or LAND_SURFACE at all — never a substitute for the table.
      Rows keyed "CC_unallocated" (FR, IT, FI, BG, EL, SE, DK, NO, BE, LV, LU,
      SI) hold population that could not be placed in any cell; they have no
      geometry, so they are dropped with a reported count.
      Not used here, but published alongside: ESTAT_Census_2021_country.csv.zip
      (raw per-country CSVs) and ESTAT_Census_2021_V2_SDMX_Metadata.zip (the
      NSIs' original SDMX metadata). The continental table is what a
      multi-country FUA needs, so per-country files would only add bookkeeping.
    licence: "CC-BY 4.0 — © European Union, Eurostat/GISCO (census 2021 grid)"
    resolution_m: 1000
    id_column: "GRD_ID"
    # Data member inside the archive (case-insensitive substring). Named
    # explicitly: the V3 zip holds GeoPackage, CSV, Parquet AND GeoTIFF, and the
    # extension preference would take the 1.3 GB GeoPackage. null falls back to
    # .gpkg > .geoparquet/.parquet > .csv, largest of that kind.
    member: "ESTAT_Census_2021_V3.csv"
    # GeoPackage layer name; only consulted on the GeoPackage/Parquet path. null
    # lets the loader enumerate layers and, when there are several, read the ones
    # whose names carry a code used by `shares` (a per-variable GeoPackage, as
    # V1-0 appears to be), merging them on the cell centroid.
    layer: null
    # Per-variable downloads, {code: url}, for a release that ships one file per
    # variable instead of a wide table — mirrors sources.ses.urls. Merged with
    # whatever `url` above provides, on the cell centroid. Not needed for V3.
    urls: {}
    # Reserved missing-data codes (release read.me): -8888 withheld for
    # confidentiality, -9999 unavailable for other reasons. These MUST be
    # stripped — a share of -8888/1000 does not read as an error, it reads as an
    # extreme vulnerability score and would drag the cell into a stratum tail.
    missing_values: [-8888, -9999]
    # Vulnerability shares derived from the raw counts. Numerator and
    # denominator are both LISTS so a share can sum published categories and
    # pick its own base.
    shares:
      share_u15:
        numerator: ["Y_LT15"]
        denominator: ["T"]
      share_ge65:
        numerator: ["Y_GE65"]
        denominator: ["T"]
      employment_share:
        # Employed persons over the WORKING-AGE population, not the total: an
        # employment share over everyone is confounded by age structure, which
        # is the other vulnerability layer here. EMP is voluntary under
        # Reg. 2018/1799, so this share is absent in some countries.
        numerator: ["EMP"]
        denominator: ["Y_1564"]
      foreign_born_share:
        # "Where published": born in another EU country + born elsewhere. Both
        # codes absent -> the share is skipped, not zero-filled.
        numerator: ["EU_OTH", "OTH"]
        denominator: ["T"]

routing:
  # r5:       PRIMARY engine, every tier — real street-network routing via
  #           r5py (needs .pbf + JDK 21; +GTFS only for transit). Affordable
  #           at scale because of reverse routing (`reverse_direction`):
  #           ~30 min/city walk+car, not ~8-12 h. Promoted from Tier-2
  #           reference after the E.1 cross-check showed the friction error
  #           is CITY-SPECIFIC (gini_emergency -30 % Hamburg, -18.5 % Köln —
  #           methods.md §7.1) and therefore not correctable.
  # friction: the SENSITIVITY variant — least-cost paths over the Weiss et
  #           al. ~1 km friction surfaces (walk/car only, a few MB per city,
  #           no Java). Run it against an r5 baseline with
  #           `depacc engine-check --city <id> --engine friction`.
  # Facilities come from Overpass under BOTH engines (sources.facilities
  # defaults to overpass) — the engine choice never changes the facility set.
  # Every city config MUST declare its engine explicitly
  # (test_every_city_declares_its_routing_engine).
  engine: "r5"
  departure:
    # Fixed representative departure for transit routing (Tier 2); walk/car
    # are time-independent in R5. Weekday morning, local time.
    weekday: "tuesday"
    time_window_start: "08:00"
    time_window_minutes: 60
  max_time_min: 120      # absolute travel-time cutoff / fallback per mode
  # Per-mode cutoffs (minutes) actually used to build the matrices. Set well
  # beyond the 2SFCA catchment bandwidths and past DLF/DCF saturation, but
  # tight enough to keep large-FUA matrices tractable. null -> max_time_min.
  max_time_min_by_mode:
    walk: 30
    car: 60
    transit: 75
  walk_speed_kmh: 4.8
  # Origins are centroids of populated GHS-POP 100m cells inside the FUA.
  min_cell_population: 1.0
  # Scale controls for large FUAs (176k+ cells): compute travel times in
  # origin batches to bound memory, and keep only the k nearest reachable
  # facilities per cell and service. Far facilities are negligible for the
  # soft-min and nearest-facility measures; k is set generously so the 2SFCA
  # demand count is essentially complete within each catchment. Both are
  # sensitivity-testable and apply to every routing engine.
  origin_chunk: 5000
  k_nearest: 30
  # Reverse-mode chunks are additionally capped so one dense r5py result stays
  # within this many origin x destination pairs. In reverse mode the dense
  # side is the CELLS (~100k), so `origin_chunk` alone would allow a
  # 5000 x 100k = 500M-pair allocation — the multi-GB frame that starved the
  # Köln cross-check runner to death (run 30526795903).
  reverse_pair_budget: 12000000
  # Modes routed FACILITIES -> CELLS and transposed back. R5 costs one street
  # search per ORIGIN, so for a service with few facilities (27 emergency
  # departments vs 176 137 Hamburg cells) searching from the facilities is
  # orders of magnitude cheaper: measured at ~39.5 min per 5 000-cell forward
  # chunk, that is ~24 h vs minutes per emergency service (run 30251028718).
  # The transpose is exact only for a symmetric network — one-way streets and
  # turn restrictions make car time direction-dependent — so this is EMPTY by
  # default and the access stage reports the measured asymmetry whenever it is
  # switched on. Only applied where cells outnumber facilities >= 20x.
  reverse_direction: []
  # Wall-clock budget for the access stage, in minutes. null = unlimited (the
  # default: an interactive run should never stop itself). Set it in CI, where
  # a hosted runner caps a job at 6 h and CANCELS it on timeout — and a
  # cancelled job skips the cache-save step, so an unbudgeted overrun throws
  # away every matrix it built (run 30164334307 lost 2 h 20 of Hamburg walk
  # routing that way). With a budget the stage stops cleanly inside the job,
  # the cache is written, and the next dispatch resumes from the last finished
  # origin chunk. Overridable per run with DEPACC_ROUTING_BUDGET_MIN.
  time_budget_min: null

softmin:
  # Soft-minimum smoothing parameter kappa (per minute). Larger kappa -> closer
  # to the hard minimum; the softmin lies in [min - ln(n)/kappa, min].
  # Methodological smoothing choice, NOT a literature-transferred parameter;
  # sensitivity-test over `kappa_sensitivity`.
  kappa: 0.5
  kappa_sensitivity: [0.1, 0.25, 0.5, 1.0, 2.0]

catchment:  # 2SFCA congestion factor (everyday regime only)
  kernel:
    type: "gaussian"     # gaussian | binary
    # Catchment bandwidth in minutes, per mode. Methodological choice,
    # sensitivity-tested; harmonised across cities.
    bandwidth_min:
      walk: 15
      car: 30
      transit: 30
  # Congestion-inflation exponent gamma: c_j = (R_ref / R_j) ** gamma, where
  # R_j is the 2SFCA supply-to-demand ratio of facility j and R_ref the
  # population-weighted median ratio in the city. gamma = 0 disables
  # congestion inflation. Sensitivity-tested.
  gamma: 0.5
  gamma_sensitivity: [0.0, 0.25, 0.5, 1.0]
  reference: "weighted_median"   # weighted_median | mean
  # Numerical guards on the inflation factor (not literature parameters).
  factor_clip: [0.5, 4.0]

regimes:
  # Which travel-time mode(s) feed each regime's surface. With several modes
  # the elementwise minimum per origin-destination pair is used (traveller
  # takes the faster option). The FIRST mode also selects the 2SFCA catchment
  # bandwidth. Tier-1 runs must not list "transit".
  everyday:
    modes: ["walk"]
    # Composite across everyday services: equal-weight mean of the
    # per-service deprivation surfaces (weights overridable per city).
    composite: "mean"
    # The two hierarchical categories are split into two sub-type services
    # each (school_primary/secondary, green_space_local/district). Half-weight
    # each sub-type so a split category still counts once overall, keeping the
    # five everyday categories equally weighted (gp, pharmacy, supermarket,
    # school, green space). Services not listed default to weight 1.
    composite_weights:
      school_primary: 0.5
      school_secondary: 0.5
      green_space_local: 0.5
      green_space_district: 0.5
  emergency:
    modes: ["car"]
    composite: "mean"

unreachable:
  # Two DISTINCT meanings of "unreachable" are kept apart (methods.md §2):
  #
  #  * "no network path" — the cell is genuinely unroutable (disconnected from
  #    the network). Detected by a SHARED, service- and mode-independent
  #    routability probe (a cell that reaches ZERO facilities of ANY service in
  #    ANY mode), so the everyday and emergency masks coincide. These are the
  #    ONLY masked/greyed cells; `policy` governs them.
  #  * "reachable but service-deprived" — the cell IS routable but no facility
  #    of a given service lies within the cutoff. This is NOT unreachability: a
  #    large-but-finite effective time (`finite_fill_min`) is assigned so the
  #    DLF saturates near Lmax (high deprivation) and the cell stays on the map.
  #    This prevents one sparse layer (e.g. green space) from masking the city.
  #
  # Policy for genuinely-unroutable cells: "exclude" drops them from aggregate
  # statistics (but always reports their count and population share);
  # "cap_at_max_time" assigns the deprivation value at max_time_min.
  policy: "cap_at_max_time"
  # Effective time (minutes) assigned to reachable-but-service-deprived cells.
  # Must be well past the DLF inflection so deprivation saturates high; NOT a
  # literature parameter. null -> use routing.max_time_min.
  finite_fill_min: null

equity:
  # SES ranking variable for the concentration index. Ascending rank, so
  # CI < 0 = deprivation concentrated among the low-SES population. The
  # harmonised default is the census employment share — the only SES-flavoured
  # variable published EU-wide on the census grid (age is vulnerability, not
  # SES). It is a PROXY: activity status, not income, and voluntary under
  # Reg. 2018/1799, so it is absent in some countries — the equity stage then
  # falls back to the income/rent name heuristic and, failing that, omits the
  # concentration index rather than ranking on something arbitrary. Tier-2
  # cities override this with their national income/rent grid column.
  ses_rank_column: "ses_census_employment_share"
  # SES covariate carrying the cross-city `slope_ses_*` feature. Kept SEPARATE
  # from ses_rank_column on purpose: that key is per-city (Tier-2 cities point
  # it at their national rent grid), whereas this one must be the SAME variable
  # in every city or the cross-city gradient pools incommensurable betas. The
  # winner per city is recorded in cityvector.csv as `slope_ses_column`.
  cityvector_ses_column: "ses_census_employment_share"
  # STRICT: a city whose harmonised column is unusable gets NO slope_ses_*,
  # rather than a substitute. Recording the substitute was supposed to make a
  # mixed sample visible, but Hamburg showed visible is not usable — its census
  # employment share is non-null on 295 cells and constant zero (EMP is
  # voluntary under Reg. 2018/1799 and DE did not report it), so the city fell
  # back to its German rent grid, and a ten-city pilot would put ten different
  # variables into one column that clustering treats as one. Set false only for
  # a deliberately Tier-2-only comparison.
  cityvector_ses_strict: true
  # Minimum share of analysis cells on which an ses_* column must carry a value
  # before it may be regressed, rank the concentration index, or define a
  # stratum. A covariate on a small, non-randomly-published subsample gives a
  # p-value about that subsample, not the city, and nothing downstream can tell
  # the two apart. Hamburg: employment share 0.2% (dropped), vacancy rate 2.6%
  # (dropped — it had been supplying the largest everyday gradient in the
  # table), ownership 35% and net rent 25% (kept; read their _ratio_covered
  # columns). Per-covariate support is always written to equity_ses_coverage.csv.
  min_covariate_valid_share: 0.2
  # Vulnerability-stratified deprivation. The default strata are the
  # census-harmonised age shares, so every city gets the same cut; `level`
  # keeps the layers apart and must never be pooled across levels in a
  # cross-city comparison ("age_census" = broadcast 1 km EU census;
  # "age_national" = a Tier-2 fine grid; "income_tier2" = Tier-2 only).
  vulnerability_strata:
    - name: "elderly_census"
      column: "ses_census_share_ge65"
      direction: "high"
      quantile: 0.75
      level: "age_census"
    - name: "children_census"
      column: "ses_census_share_u15"
      direction: "high"
      quantile: 0.75
      level: "age_census"

typology:
  # Bivariate everyday x emergency classification thresholds on the
  # population-weighted PERCENTILE surfaces. 0.50 = median split; 0.75 =
  # acute compounding. Both are computed and reported — not a single split.
  thresholds: [0.5, 0.75]

cityvector:
  # LEVEL features (deprivation-function-FREE): population share whose
  # regime travel time exceeds each policy threshold (minutes). Comparable
  # across cities independent of any deprivation-function calibration.
  access_thresholds_min:
    everyday: [15, 30]
    emergency: [30, 45, 60]
  # Cross-city feature standardisation before clustering: "robust"
  # (median / IQR; default — small, outlier-prone sample) or "zscore".
  cross_city_scaler: "robust"
  # A feature missing for more than this share of cities is DROPPED rather than
  # imputed. A city with no value for a retained feature lands at the sample
  # median of it — declared exactly typical on a variable never measured for it,
  # then clustered on that. Below the bound that is an acceptable trade for
  # keeping the dimension (and every imputed city/feature pair is named in the
  # log); above it, the dimension is mostly fiction. `slope_ses_*` is the live
  # case: activity status is voluntary under Reg. 2018/1799 and DE and FR are
  # the only two countries that do not report it, so every German and French
  # city carries NaN there by design — see methods.md §6.1.
  max_missing_share: 0.25
  clustering:
    k_range: [2, 6]      # candidate cluster counts; k chosen by silhouette
    bootstrap: 50        # resamples for the stability (ARI) check
    random_state: 0

friction:
  # Weiss et al. (2020) friction surfaces, fetched as per-city WCS windows
  # from the Malaria Atlas Project geoserver (CC-BY 4.0). Override `wcs` if
  # the coverage ids change upstream (see access/friction.py).
  # Margin (degrees) around the FUA bbox: enough for detours around the
  # boundary, small enough to keep the raster (and cost-distance memory)
  # bounded. ~0.25 deg is ~28 km.
  pad_deg: 0.25
  # Facility sources per Dijkstra call — caps peak memory at
  # (source_batch x n_pixels), never (n_facilities x n_pixels).
  source_batch: 64
  wcs:
    base: "https://data.malariaatlas.org/geoserver/Accessibility/ows"
    coverages:
      car: "Accessibility__202001_Global_Motorized_Friction_Surface"
      walk: "Accessibility__202001_Global_Walking_Only_Friction_Surface"

quality:
  # Restrict the Tier-1 sample to cities in countries whose OSM completeness
  # ratio (OSM facility count / registry count) is at least this value.
  # null disables the filter.
  completeness_threshold: null
  benchmark_services: ["hospital", "pharmacy"]
  # E.2 — OSM tag rules counted per benchmark service (country-wide Overpass
  # `out count`). Deliberately BROADER than the pipeline's per-city extraction
  # where the registry is broader: national registries count ALL hospitals, so
  # the benchmark counts amenity=hospital without the emergency=yes filter.
  benchmark_osm:
    hospital:
      - { key: "amenity", value: "hospital" }
    pharmacy:
      - { key: "amenity", value: "pharmacy" }
  # National registry counts (columns: country, service, registry_count,
  # source, year[, note]) compiled by hand from the named sources — each row
  # is auditable via `source`. DE first (E.2); extend per country as the
  # sample grows.
  registry_counts_csv: "config/registry_counts.csv"
  # Country population for the intrinsic facilities-per-100k metric.
  country_population:
    DE: 84669326   # Destatis, 31.12.2023 — VERIFY before publication

output:
  root: "data/derived"
  raw_root: "data/raw"
  cache_root: "data/cache"
